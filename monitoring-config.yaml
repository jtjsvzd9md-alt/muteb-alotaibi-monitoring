name: enterprise-monitoring
version: 1.0
metadata:
  name: monitoring-for-organization
  owner: "متعب العتيبي"
  created_at: 2026-09-04

globalMetrics:
  - id: exchange_rates
    label: "أسعار الصرف"
    sources:
      - type: api
        url: "https://api.exchangerates.example/latest"
    frequency_seconds: 300
    thresholds:
      warning: { change_percent: 2.0 }
      critical: { change_percent: 5.0 }

aiMonitoring:
  models:
    - id: gpt-6-astra
      label: "GPT-6-Astra"
      enabled: true
      metrics:
        - name: latency_ms
          frequency_seconds: 60
          thresholds: { warning: 1000, critical: 5000 }
        - name: error_rate_percent
          frequency_seconds: 60
          thresholds: { warning: 1.0, critical: 5.0 }
      governance:
        drift_detection: { enabled: true, window_days: 7, action: "notify" }

accountingMonitoring:
  - id: ledger_reconciliation
    label: "مطابقة السجلات"
    frequency_seconds: 3600
    checks:
      - name: unmatched_transactions
        thresholds: { warning_count: 1, critical_count: 5 }

treasuryMonitoring:
  cash_position:
    frequency_seconds: 900
    metrics:
      - name: available_cash_usd
        thresholds: { warning: 100000, critical: 50000 }
  payment_limits:
    daily_limit_usd: 1000000
    alert_on_exceed: true

alerts:
  default_channels:
    - type: slack
      target: "#alerts-finance"
    - type: email
      target: "Ox5qmuteb@gmail.com"
  escalation:
    - after_minutes: 15
      to: "oncall-senior"
    - after_minutes: 60
      to: "head-of-finance"

integrations:
  prometheus: { enabled: true, pushgateway: "https://pushgateway.example" }
  grafana: { enabled: true, dashboard_prefix: "Enterprise/" }
  logging: { elk: "https://elk.example" }

notifications:
  deduplication_window_seconds: 300
